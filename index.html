<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELTÉ — Made to melt the moment.</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#120805;
  color:white;
  font-family:Arial, sans-serif;
  overflow-x:hidden;
}

/* =========================
   SCENE 1
========================= */

.hero{
  height:100svh;
  min-height:650px;
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#120805;
}

/* IMAGE */

.hero-img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;

  transform:scale(1.12);

  animation:slowZoom 12s ease-in-out infinite alternate;

  filter:
    brightness(.62)
    contrast(1.08)
    saturate(1.08);

  z-index:1;
}

@keyframes slowZoom{

  from{
    transform:scale(1.12);
  }

  to{
    transform:scale(1.22);
  }

}

/* CINEMATIC OVERLAY */

.overlay{
  position:absolute;
  inset:0;
  z-index:2;

  background:
    radial-gradient(
      circle at center,
      transparent 20%,
      rgba(0,0,0,.25) 55%,
      rgba(0,0,0,.8) 100%
    );
}

/* TOP NAV */

.nav{
  position:absolute;
  top:30px;
  left:0;

  width:100%;

  padding:0 7%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  z-index:5;
}

.logo{
  font-size:20px;
  font-weight:bold;
  letter-spacing:5px;
}

.menu{
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
}

/* HERO TEXT */

.hero-content{
  position:relative;
  z-index:4;

  text-align:center;

  width:90%;

  transform:translateY(30px);

  opacity:0;

  animation:contentReveal 1.5s
  cubic-bezier(.2,.8,.2,1)
  .3s forwards;
}

@keyframes contentReveal{

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.small-text{
  font-size:11px;
  letter-spacing:6px;
  text-transform:uppercase;

  margin-bottom:20px;

  opacity:.8;
}

.title{
  font-size:
    clamp(4rem,17vw,10rem);

  line-height:.8;

  letter-spacing:-5px;

  font-weight:800;
}

.tagline{
  margin-top:28px;

  font-size:
    clamp(14px,3vw,20px);

  letter-spacing:3px;

  opacity:.85;
}

/* CTA */

.cta{
  display:inline-flex;

  margin-top:40px;

  padding:15px 27px;

  border:1px solid rgba(255,255,255,.6);

  border-radius:50px;

  color:white;

  text-decoration:none;

  font-size:11px;

  letter-spacing:3px;

  text-transform:uppercase;

  transition:.4s;
}

.cta:hover{
  background:white;
  color:#120805;
}

/* SCROLL */

.scroll{
  position:absolute;

  bottom:25px;

  left:50%;

  transform:translateX(-50%);

  z-index:5;

  text-align:center;

  opacity:0;

  animation:fadeScroll 1s 2s forwards;
}

@keyframes fadeScroll{

  to{
    opacity:1;
  }

}

.scroll-line{
  width:1px;
  height:55px;

  margin:auto;

  background:linear-gradient(
    white,
    transparent
  );

  animation:scrollLine 1.5s infinite;
}

@keyframes scrollLine{

  0%{
    transform:scaleY(.3);
    transform-origin:top;
  }

  50%{
    transform:scaleY(1);
  }

  100%{
    transform:scaleY(.3);
    transform-origin:bottom;
  }

}

.scroll p{
  margin-top:8px;

  font-size:9px;

  letter-spacing:4px;

  text-transform:uppercase;
}

/* =========================
   SCENE 2
========================= */

.scene-two{

  height:100svh;

  min-height:650px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  background:
    radial-gradient(
      circle at center,
      #5a2b18,
      #160805 70%
    );

  padding:30px;

}

.scene-two h2{

  font-size:
    clamp(3rem,12vw,8rem);

  line-height:.85;

  letter-spacing:-3px;

}

.scene-two span{

  display:block;

  margin-top:30px;

  font-size:12px;

  letter-spacing:4px;

  opacity:.7;

}

/* MOBILE */

@media(max-width:600px){

  .hero-img{
    width:130%;
    left:-15%;
  }

  .nav{
    padding:0 6%;
  }

  .title{
    letter-spacing:-3px;
  }

}
</style>
</head>


<body>


<!-- =========================
     SCENE 1
========================= -->

<section class="hero" id="hero">

  <img
    class="hero-img"
    src="https://images.unsplash.com/photo-1554878050-2ddfd87e7999?auto=format&fit=crop&fm=jpg&q=85&w=1800"
    alt="Chocolate ice cream"
  >

  <div class="overlay"></div>


  <!-- NAV -->

  <nav class="nav">

    <div class="logo">
      MELTÉ
    </div>

    <div class="menu">
      MENU
    </div>

  </nav>


  <!-- HERO -->

  <div class="hero-content">

    <div class="small-text">
      Crafted for cravings
    </div>

    <h1 class="title">
      MELTÉ
    </h1>

    <p class="tagline">
      Made to melt the moment.
    </p>

    <a href="#scene2" class="cta">
      Discover
    </a>

  </div>


  <!-- SCROLL -->

  <div class="scroll">

    <div class="scroll-line"></div>

    <p>
      Scroll
    </p>

  </div>

</section>



<!-- =========================
     SCENE 2
========================= -->

<section
  class="scene-two"
  id="scene2"
>

  <div>

    <h2>
      YOUR<br>
      CRAVING<br>
      STARTS HERE.
    </h2>

    <span>
      SCENE 02
    </span>

  </div>

</section>


<script>

/* =========================
   SCROLL MOTION
========================= */

const hero =
document.querySelector(".hero");

const image =
document.querySelector(".hero-img");

const content =
document.querySelector(".hero-content");


window.addEventListener(
  "scroll",
  () => {

    const scroll =
      window.scrollY;

    const height =
      window.innerHeight;


    /* IMAGE MOVEMENT */

    image.style.transform =
      `scale(${1.12 + scroll / 5000})
       translateY(${scroll * .12}px)`;


    /* TEXT MOVEMENT */

    content.style.transform =
      `translateY(${-scroll * .25}px)`;


    /* HERO FADE */

    if(scroll < height){

      hero.style.opacity =
        1 - scroll / height * .75;

    }

  }
);

</script>

</body>
  </html>
